name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Exact patch, not a major, because a release job cannot be safely retried and
      # should not vary with whichever 24.x the runner's tool cache happens to hold.
      #
      # It is NOT what gates OIDC here. pnpm performs the token exchange itself and
      # never shells out to the npm CLI, so the bundled npm version is irrelevant on
      # this path; `packageManager` (pnpm 12.16.1) is the version that matters, and
      # it needs to stay at 11.1.3 or newer. The npm-CLI OIDC regressions recorded in
      # the global notes apply to the repos that run `npm publish`, not to this one.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate (format, lint, typecheck, test, build)
        run: pnpm validate

      # No NODE_AUTH_TOKEN: pnpm exchanges the job's OIDC token for a short-lived
      # registry credential, so there is no static secret to rotate. The trust is
      # configured on npmjs.com against this repo and this workflow file.
      #
      # If that trust is missing, pnpm logs a line beginning "Skipped OIDC:" as a
      # *warning* and falls back to the placeholder token setup-node wrote, which the
      # registry rejects with a masked 404. Grep for "Skipped OIDC:" — the rest of that
      # line varies by failure (ERR_PNPM_AUTH_TOKEN_EXCHANGE for a rejected exchange,
      # ERR_PNPM_AUTH_TOKEN_FETCH for a network failure). It is the real error; the
      # 404 is only the symptom.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance

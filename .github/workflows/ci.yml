name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repo, so the token gets nothing more.
permissions:
  contents: read

# A newer push to a pull request cancels the build it supersedes. A push to main gets a group of its own,
# because GitHub cancels a waiting run when a newer one joins its group, even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        # 22.18.0 is the floor in package.json engines; test it exactly, not the newest 22.
        node-version: [22.18.0, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # validate's steps, checking format and lint instead of fixing them. Type "run": a bare `pnpm ci` is
      # pnpm's own clean install, not this script.
      - name: Check (format, lint, typecheck, test, build)
        run: pnpm run ci

      # server.json carries the version into the MCP Registry. prepublishOnly checks it
      # too, but that fires on the release, where a failure has already cut a tag.
      - name: Check server.json is in step with package.json
        run: node scripts/sync-server-json.mjs --check

      - name: Check dist files exist
        run: |
          ls -la dist/
          test -f dist/todo-index.js
          test -f dist/cli.js
          test -f dist/auth-server.js
          test -f dist/create-mcp-config.js

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22.18.0 is the floor in package.json engines; test it exactly, not the newest 22.
        node-version: [22.18.0, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate (format, lint, typecheck, test, build)
        run: pnpm validate

      # server.json carries the version into the MCP Registry. prepublishOnly checks it
      # too, but that fires on the release, where a failure has already cut a tag.
      - name: Check server.json is in step with package.json
        run: node scripts/sync-server-json.mjs --check

      - name: Check dist files exist
        run: |
          ls -la dist/
          test -f dist/todo-index.js
          test -f dist/cli.js
          test -f dist/auth-server.js
          test -f dist/create-mcp-config.js

  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm run format:check
